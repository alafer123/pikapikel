    function TiltCard({ children, className = "" }) {
      const cardRef = useRef(null);
      const [style, setStyle] = useState({});

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -5;
        const rotateY = ((x - centerX) / centerX) * 5;
        setStyle({
          transform: `perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-4px)`,
          transition: 'transform 0.1s ease-out'
        });
      };

      const handleMouseLeave = () => {
        setStyle({
          transform: 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)',
          transition: 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1)'
        });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={style}
          className={className}
        >
          {children}
        </div>
      );
    }

                      src={pairedProduct.img}
                      alt={pairedProduct.name}
                      className="w-12 h-12 rounded-xl object-cover border border-white/20"
                    />
                    <div>
                      <p className="text-xs font-bold text-[#84CC16]">Recommended Pairing Jar</p>
                      <p className="text-sm font-extrabold text-white">{pairedProduct.name}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => addToCart(pairedProduct)}
                    className="w-full sm:w-auto px-5 py-2.5 rounded-full bg-[#84CC16] text-black font-extrabold text-xs hover:brightness-110 transition shadow-lg"
                  >
                    + Add Paired Jar ({formatPrice(pairedProduct.pricePhp, pairedProduct.priceUsd)})
                  </button>
                </div>
              </div>
            </div>
          </section>

          {/* BUNDLES */}
          <section id="bundles" className="py-24 px-6 max-w-6xl mx-auto">
            <div className="text-center max-w-2xl mx-auto mb-16">
              <span className="text-xs font-extrabold uppercase tracking-widest text-[#FFB800]">
                Nationwide Insulated Delivery
              </span>
              <h2 className="text-3xl md:text-5xl font-extrabold mt-2">
                Stock Up With Fiesta Packs
              </h2>
              <p className="text-amber-100/75 mt-3 text-sm md:text-base">
                Save up to 20% when you bundle our pickled green mangoes, spicy labuyo jars, and ripe mango salsas.
              </p>
            </div>

            <div className="grid md:grid-cols-3 gap-8 items-stretch">
              {BUNDLES.map((bundle) => (
                <TiltCard
                  key={bundle.id}
                  className={`rounded-3xl p-7 flex flex-col justify-between relative ${
                    bundle.popular
                      ? 'bg-gradient-to-b from-[#FFB800]/20 via-[#1B140E] to-[#1B140E] border-2 border-[#FFB800] shadow-[0_0_55px_-12px_rgba(255,184,0,0.4)]'
                      : 'bg-[#1B140E] border border-amber-500/20'
                  }`}
                >
                  {bundle.popular && (
                    <span className="absolute -top-3.5 left-1/2 -translate-x-1/2 px-4 py-1 rounded-full bg-[#FFB800] text-black font-extrabold text-[11px] uppercase tracking-wider shadow">
                      {bundle.badge}
                    </span>
                  )}

                  <div>
                    <div className="relative h-44 rounded-2xl overflow-hidden mb-5">
                      <img
                        src={bundle.img}
                        alt={bundle.name}
                        className="w-full h-full object-cover"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent" />
                      <span className="absolute bottom-3 left-3 px-3 py-1 rounded-full bg-black/75 text-xs font-extrabold text-[#84CC16]">
                        📦 {bundle.jars}
                      </span>
                    </div>

                    <h3 className="text-xl font-extrabold text-white">{bundle.name}</h3>
                    <p className="text-xs text-amber-100/70 mt-1">{bundle.sub}</p>

                    <div className="my-5 flex items-baseline gap-2">
                      <span className="text-4xl font-extrabold text-[#FFB800]">
                        {formatPrice(bundle.pricePhp, bundle.priceUsd)}
                      </span>
                      {currency === 'PHP' && (
                        <span className="text-sm text-amber-100/40 line-through">
                          ₱{bundle.oldPricePhp}
                        </span>
                      )}
                    </div>

                    <ul className="space-y-2.5 text-xs text-amber-100/85 mb-8">
                      {bundle.features.map((feat, i) => (
                        <li key={i} className="flex items-start gap-2">
                          <span className="text-[#84CC16] font-bold">✔</span>
                          <span>{feat}</span>
                        </li>
                      ))}
                    </ul>
                  </div>

                  <button
                    onClick={() => addToCart(bundle)}
                    className={`w-full py-3.5 rounded-full font-extrabold text-xs uppercase tracking-wider transition ${
                      bundle.popular
                        ? 'bg-gradient-to-r from-[#84CC16] to-[#FFB800] text-black shadow-lg hover:brightness-110'
                        : 'bg-white/10 text-white hover:bg-white hover:text-black'
                    }`}
                  >
                    Add {bundle.jars} Pack →
                  </button>
                </TiltCard>
              ))}
            </div>
          </section>

          {/* FOOTER */}
          <footer className="border-t border-amber-500/20 bg-[#0D0907] py-16 px-6">
            <div className="max-w-6xl mx-auto grid md:grid-cols-3 gap-10 text-sm">
              <div>
                <div className="flex items-center gap-2 text-lg font-extrabold">
                  <span className="w-8 h-8 rounded-full bg-[#FFB800] text-black flex items-center justify-center">🥭</span>
                  <span>PIK-A-PIKEL®</span>
                </div>
                <p className="text-xs text-amber-100/60 mt-3 leading-relaxed">
                  Pik-a-Pikel® is everything and anything pickled! Proudly crafted in Tarlac City by Sangkutsa Food Products Inc.
                </p>
              </div>

              <div>
                <h4 className="font-extrabold text-[#FFB800] text-xs uppercase tracking-wider mb-3">
                  Commissary & Direct Orders
                </h4>
                <p className="text-xs text-amber-100/70">
                  Block 3 Lot 2, MacArthur Highway, San Francisco, Tarlac City, Tarlac, Philippines 2300
                </p>
                <p className="text-xs text-amber-100/70 mt-2">
                  📧 info@sangkutsafoods.com • 📱 +63-917-8416725
                </p>
              </div>

              <div className="flex flex-col items-start md:items-end justify-between">
                <button
                  onClick={() => setShowLoader(true)}
                  className="px-4 py-2 rounded-full bg-white/10 hover:bg-[#FFB800] hover:text-black text-xs font-bold transition"
                >
                  🎬 Replay Cartoon Mango Loader
                </button>
                <p className="text-xs text-amber-100/40 mt-4">
                  © 2026 Sangkutsa Food Products Inc. All rights reserved.
                </p>
              </div>
            </div>
          </footer>

          {/* BASKET DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-[80] flex justify-end bg-black/70 backdrop-blur-sm">
              <div className="w-full max-w-md bg-[#1B140E] border-l border-amber-500/30 h-full flex flex-col justify-between p-6 shadow-2xl">
                <div>
                  <div className="flex items-center justify-between border-b border-white/10 pb-4">
                    <h3 className="text-xl font-extrabold flex items-center gap-2">
                      <span>🛒 Your Fiesta Basket</span>
                      <span className="text-xs px-2.5 py-0.5 rounded-full bg-[#FFB800] text-black">
                        {totalItems}
                      </span>
                    </h3>
                    <button
                      onClick={() => setIsCartOpen(false)}
                      className="px-3 py-1 rounded-full bg-white/10 hover:bg-white/20 text-xs font-bold"
                    >
                      ✕ Close
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="py-20 text-center text-amber-100/60 text-sm">
                      Your basket is empty! Add a Fiesta Pack or Pickled Mango Jar to get started.
                    </div>
                  ) : (
                    <div className="mt-4 space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                      {cart.map((item) => (
                        <div
                          key={item.id}
                          className="flex items-center justify-between gap-3 p-3 rounded-2xl bg-black/40 border border-white/10"
                        >
                          <img
                            src={item.img}
                            alt={item.name}
                            className="w-14 h-14 rounded-xl object-cover"
                          />
                          <div className="flex-1">
                            <h4 className="text-xs font-extrabold text-white">{item.name}</h4>
                            <p className="text-xs text-[#FFB800] font-bold mt-0.5">
                              {formatPrice(item.pricePhp, item.priceUsd)}
                            </p>
                          </div>
                          <div className="flex items-center gap-2">
                            <button
                              onClick={() => updateQty(item.id, -1)}
                              className="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-xs font-bold"
                            >
                              -
                            </button>
                            <span className="text-xs font-extrabold w-4 text-center">{item.qty}</span>
                            <button
                              onClick={() => updateQty(item.id, 1)}
                              className="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 text-xs font-bold"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t border-white/15 pt-4 space-y-4">
                    <div className="flex items-center justify-between text-base font-extrabold">
                      <span>Subtotal</span>
                      <span className="text-2xl text-[#FFB800]">
                        {formatPrice(totalPhp, totalUsd)}
                      </span>
                    </div>
                    <button
                      onClick={() => {
                        alert('Demo Checkout: Connects directly to Pik-a-Pikel Viber / GCash / Maya / Shopify Checkout!');
                      }}
                      className="w-full py-4 rounded-full bg-gradient-to-r from-[#84CC16] to-[#FFB800] text-black font-extrabold text-sm hover:brightness-110 transition shadow-xl"
                    >
                      Proceed to Instant Checkout →
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
